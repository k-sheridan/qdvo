name: C/C++ CI

on:
  push:
  pull_request:

jobs:
  build-ubuntu-clang:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: C++ Lint
        uses: cpp-linter/cpp-linter-action@v2
        with:
          style: file
          tidy-checks: ''

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang \
            ccache \
            gfortran \
            libc++-dev \
            libgoogle-glog-dev \
            libatlas-base-dev \
            libsuitesparse-dev \
            libbenchmark-dev \
            libeigen3-dev \
            libopencv-dev \
            libboost-dev \
            libboost-filesystem-dev \
            libgl1-mesa-dev \
            libglew-dev \
            libepoxy-dev

      # -------------------- spdlog --------------------
      - name: Cache spdlog
        uses: actions/cache@v4
        with:
          path: spdlog
          key: ${{ runner.os }}-spdlog-v1

      - name: Build & Install spdlog
        run: |
          if [ ! -d spdlog ]; then
            git clone https://github.com/gabime/spdlog.git
            cmake -S spdlog -B spdlog/build
            cmake --build spdlog/build -j
            sudo cmake --install spdlog/build
          fi

      # -------------------- Sophus --------------------
      - name: Cache Sophus
        uses: actions/cache@v4
        with:
          path: Sophus
          key: ${{ runner.os }}-sophus-v1

      - name: Build & Install Sophus
        run: |
          if [ ! -d Sophus ]; then
            git clone https://github.com/strasdat/Sophus
            cmake -S Sophus -B Sophus/build
            cmake --build Sophus/build -j
            sudo cmake --install Sophus/build
          fi

      # -------------------- GTest --------------------
      - name: Cache GTest
        uses: actions/cache@v4
        with:
          path: googletest
          key: ${{ runner.os }}-gtest-v1

      - name: Build & Install GTest
        run: |
          if [ ! -d googletest ]; then
            git clone https://github.com/google/googletest
            cmake -S googletest -B googletest/build
            cmake --build googletest/build -j
            sudo cmake --install googletest/build
          fi

      # -------------------- Pangolin --------------------
      - name: Cache Pangolin
        uses: actions/cache@v4
        with:
          path: Pangolin
          key: ${{ runner.os }}-pangolin-v1

      - name: Build & Install Pangolin
        run: |
          if [ ! -d Pangolin ]; then
            git clone https://github.com/stevenlovegrove/Pangolin
            cmake -S Pangolin -B Pangolin/build
            cmake --build Pangolin/build -j
            sudo cmake --install Pangolin/build
          fi

      # -------------------- Project Build --------------------
      - name: Configure (Clang)
        run: |
          cmake -S . -B build \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: |
          cmake --build build -j
          cmake --build build --target QDVO
          cmake --build build --target test_qdvo
          cmake --build build --target benchmark_qdvo

      - name: Test
        run: ./build/test/test_qdvo

      - name: Benchmark
        run: ./build/bench/benchmark_qdvo

  # =====================================================================

  build-ubuntu-clang-asan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang \
            ccache \
            gfortran \
            libc++-dev \
            libgoogle-glog-dev \
            libatlas-base-dev \
            libsuitesparse-dev \
            libbenchmark-dev \
            libeigen3-dev \
            libopencv-dev \
            libboost-dev \
            libboost-filesystem-dev \
            libgl1-mesa-dev \
            libglew-dev \
            libepoxy-dev

      - name: Configure (Clang + ASAN)
        run: |
          cmake -S . -B build \
            -DQDVO_ASAN=1 \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: |
          cmake --build build -j
          cmake --build build --target QDVO
          cmake --build build --target test_qdvo
          cmake --build build --target benchmark_qdvo

      - name: Test
        run: ./build/test/test_qdvo

      - name: Benchmark
        run: ./build/bench/benchmark_qdvo
