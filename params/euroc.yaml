#Euroc Params
camera_frame: cam0
camera_topic: cam0/image_rect

use_imu: true
use_custom_imu_variances: true
gyro_variance: 0.00030461741
accel_variance: 0.25
imu_topic: imu0
imu_frame: imu4

#-=-=-=-=-=-
min_new_feature_dist: 25
num_features: 200
fast_threshold: 45

default_point_depth: 0.5
default_point_depth_variance: 400

# this is the norm not squared norm
huber_width: 1e-6
# max reprojection error allowed after motionBA update
maximum_reprojection_error: 0.001
# max error a candidate may have before it is integrated into motion estimates
maximum_candidate_reprojection_error: 0.00005
# max depth variance before the point may be evaluated for integration
moba_candidate_variance: 10

# maximum iterations during motion update
moba_max_iterations: 10
eps_moba: 0.00000001

# this will scale an image (scale_factor = 1/#)
inverse_image_scale: 1

# should invio publish the insight image
# this image shows information about what invio is currently doing
publish_insight: true
